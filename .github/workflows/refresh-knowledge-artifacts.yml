name: Refresh Knowledge Graph, Metrics & Auditor Pack

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-artifacts:
    name: Rebuild Metrics, Triple-Format KG & Auditor Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r tools/requirements-knowledge.txt

      - name: Collect platform KPIs (live GitHub sample + safe baselines)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/metrics/collect_platform_metrics.py --github-live --out data/metrics.json --refresh-auditor-metrics

      - name: Rebuild deterministic Knowledge Graph & refresh AI Auditor Pack
        run: python3 tools/knowledge_graph/build_knowledge_graph.py --out-dir . --refresh-auditor

      - name: Run knowledge validation suites
        run: |
          python3 scripts/verify_ecosystem_knowledge.py --public-only
          python3 scripts/check_public_claims.py
          pytest -q tests/test_public_claims.py tests/test_ecosystem_registry.py tests/test_auditor_pack_and_research.py tests/test_knowledge_graph.py tests/test_platform_metrics.py

      - name: Open HITL Pull Request if artifacts changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "chore(knowledge): refresh metrics, knowledge graph & auditor pack"
          branch: "chore/refresh-knowledge-artifacts"
          delete-branch: true
          title: "chore(knowledge): refresh metrics, knowledge graph & auditor pack"
          body: |
            Automated scheduled rebuild of `data/metrics.json`, `knowledge_graph.{json,graphml,rdf}`, and `/docs/auditor/`.

            Vertex 4 HITL: Automated merge disabled — awaiting manual human review.
          base: main
