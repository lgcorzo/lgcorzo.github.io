name: Site Consistency & Canonical Claims Check

on:
  push:
    branches:
      - main
      - "011-**"
      - "feat/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-claims:
    name: Verify Canonical Public Claims & Internal Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for html-validate
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Python test dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r tools/requirements-knowledge.txt

      - name: Run Deterministic Canonical Claims & Knowledge Checks
        run: |
          python3 scripts/check_public_claims.py
          python3 scripts/verify_ecosystem_knowledge.py --public-only

      - name: Run HTML Validation
        run: npx --yes html-validate index.html architecture.html lifecycle.html fork-policy.html notebooks.html start-here.html start-here/index.html ai-agents/index.html metrics.html

      - name: Run Pytest Verification Suite
        run: pytest -q

  verify-dark-gravity-mcp:
    name: Verify Read-Only Rust MCP Server (dark-gravity-mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: dark-gravity-mcp

      - name: Run cargo test for dark-gravity-mcp
        run: cargo test --manifest-path dark-gravity-mcp/Cargo.toml
